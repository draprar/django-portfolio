name: Django CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI: "true"
      DJANGO_TESTING: "true"
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "true"
      SENTRY_DSN: ""
      CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      AWS_STORAGE_BUCKET_NAME: dummy-bucket
      SUPABASE_PROJECT_REF: dummy-project
      BREVO_API_KEY: ""
      EMAIL_HOST: ""
      EMAIL_PORT: "587"
      EMAIL_USE_TLS: "true"
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      DEFAULT_FROM_EMAIL: test@example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # GitHub sometimes 500s the spaCy model wheel. Retry the same install.
          pip install -r requirements-dev.txt \
            || { sleep 10; pip install -r requirements-dev.txt; } \
            || { sleep 20; pip install -r requirements-dev.txt; }

      - name: Lint (ruff, blocking)
        run: ruff check .

      - name: Type check (mypy, blocking)
        run: |
          mypy config core tonguetwister gallery docdiff rugby bies analytics rozdroze code poligon wiciedzy \
            --ignore-missing-imports --disable-error-code=import-untyped

      - name: Django system checks
        run: python manage.py check

      - name: Django deploy checks
        env:
          DJANGO_DEBUG: "false"
          DJANGO_ALLOWED_HOSTS: example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://example.com
          CORS_ALLOWED_ORIGINS: https://example.com
        run: python manage.py check --deploy

      - name: Verify migrations are committed
        run: python manage.py makemigrations --check --dry-run

      - name: wiciędze export drift
        run: |
          python manage.py migrate --noinput
          python manage.py import_wiciedzy
          python manage.py export_wiciedzy_texts -o /tmp/wiciedzy-eksport.md
          python - <<'PY'
          import re
          from pathlib import Path
          committed = Path("wiciedzy/teksty-eksport.md").read_text(encoding="utf-8-sig")
          fresh = Path("/tmp/wiciedzy-eksport.md").read_text(encoding="utf-8-sig")
          strip = lambda t: re.sub(r"^Wygenerowano:.*$", "", t, flags=re.M)
          if strip(committed) != strip(fresh):
              raise SystemExit("teksty-eksport.md is stale; run export_wiciedzy_texts and commit")
          PY

      - name: Run tests
        run: python -m pytest -q --cov=. --cov-report=term-missing --cov-fail-under=80

  pip_audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.10.0

      - name: Dependency audit
        run: |
          python - <<'PY'
          from pathlib import Path

          def pins(path: Path) -> list[str]:
              found: list[str] = []
              for raw in path.read_text(encoding="utf-8").splitlines():
                  line = raw.split("#", 1)[0].strip()
                  if not line or line.startswith("-r ") or " @ " in line:
                      continue
                  found.append(line)
              return found

          # Skip the spaCy model wheel. It is a direct GitHub URL, not a PyPI
          # release, and a 500 from that host was failing the audit before
          # pip-audit could run. spaCy itself stays in the audited set.
          ordered = pins(Path("requirements-prod.txt")) + pins(Path("requirements-dev.txt"))
          unique: list[str] = []
          seen: set[str] = set()
          for line in ordered:
              if line not in seen:
                  seen.add(line)
                  unique.append(line)
          Path("requirements-audit.txt").write_text("\n".join(unique) + "\n", encoding="utf-8")
          PY
          pip-audit -r requirements-audit.txt --progress-spinner off

