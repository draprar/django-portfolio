{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}BAZGROLLIN'{% endblock %}</title>
    <meta name="theme-color" content="#0a0a0a">

    <link rel="icon" href="{% static 'gallery/img/logo.ico' %}" type="image/x-icon">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'gallery/css/style.css' %}">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox.css" />
</head>
<body>

<a class="gallery-skip" href="#gallery-main">Skip to content</a>

<div id="loader">
  <div class="spinner-border text-primary" role="status"></div>
</div>

<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
        <a class="navbar-brand gallery-brand" href="{% url 'gallery:gallery_home' %}">bazgrollin'</a>
        <button class="navbar-toggler custom-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link
                        {% if request.resolver_match.url_name == 'gallery:gallery_home' %}
                            {% if not selected_category or selected_category == 'All' %}active{% endif %}
                        {% endif %}"
                        href="{% url 'gallery:gallery_home' %}">All</a>
                </li>

                {% for category in categories %}
                <li class="nav-item">
                    <a class="nav-link {% if selected_category == category.title %}active{% endif %}"
                        href="{% url 'gallery:gallery_home' %}?category={{ category.title }}">
                        {{ category.title }}
                    </a>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</nav>

<main class="container" id="gallery-main">
    {% block content %}{% endblock content %}
</main>

<footer class="footer text-center">
    <p>© {% now "Y" %} Walery — All rights reserved</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'gallery/js/main.js' %}" defer></script>

<script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox.umd.js"></script>
<script src="{% static 'gallery/js/fancybox.js' %}"></script>
<script>
  window.addEventListener('load', function () {
    var loader = document.getElementById('loader');
    if (loader) loader.style.display = 'none';
  });
</script>

</body>
</html>
