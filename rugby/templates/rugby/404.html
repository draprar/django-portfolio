{% load static %}
<html lang="pl">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>AFC Rugby Giżycko</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;700&display=swap" rel="stylesheet">
        <link href="{% static 'rugby/css/style.css' %}" rel="stylesheet">
        <link rel="icon" href="{% static 'rugby/img/favicon.ico' %}" type="image/x-icon" />
        <style>
            .rugby-404 {
                min-height: 100vh;
                min-height: 100dvh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 32px 16px;
                text-align: center;
            }
            .rugby-404 h1 {
                margin: 0;
                font-weight: 300;
                font-size: clamp(4rem, 12vw, 7rem);
                letter-spacing: 3px;
                color: var(--gold);
            }
            .rugby-404 p {
                margin: 0.4rem 0 0;
                color: var(--muted);
                font-weight: 300;
                font-size: 1.15rem;
            }
            .rugby-404 a {
                display: inline-block;
                margin-top: 1.4rem;
                color: #fff;
                text-decoration: none;
                background: linear-gradient(45deg, var(--gold), var(--gold-2));
                padding: 10px 22px;
                border-radius: 25px;
                letter-spacing: 0.4px;
                font-weight: 400;
            }
            .rugby-404 a:hover {
                background: linear-gradient(45deg, #d4a535, #8b4513);
            }
        </style>
    </head>
    <body>
        <div class="rugby-404">
            <div>
                <h1>404</h1>
                <p>Ups! Strona nie istnieje.</p>
                <a href="/">Powrót na stronę główną</a>
            </div>
        </div>
    </body>
</html>
