{% extends 'rugby/base.html' %}
{% block news %}
<div class="rugby-accounts">
  {% for account in accounts %}
  <article class="account-card mb-4" id="account-{{ account.slug }}"{% if account.year %} data-year="{{ account.year }}"{% endif %}>
    <p class="account-meta text-muted small"
       data-pl="{{ account.meta_pl }}"
       data-en="{{ account.meta_en }}">{{ account.meta_pl }}</p>
    <h3 class="h5 account-title"
        data-pl="{{ account.title_pl }}"
        data-en="{{ account.title_en }}">{{ account.title_pl }}</h3>
    <div class="account-body text-muted"
         data-pl="{{ account.body_pl }}"
         data-en="{{ account.body_en }}">{{ account.body_pl|linebreaksbr }}</div>
  </article>
  {% endfor %}
</div>
{% endblock %}
