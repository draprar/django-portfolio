{% extends "docdiff/base.html" %}
{% load static %}

{% block title %}DocDiff | Raport porównania{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'docdiff/style.css' %}">
{% endblock %}

{% block docdiff %}
<section class="docdiff-result-wrap">
  <h1 data-en="Comparison report" data-pl="Raport porównania">Raport porównania</h1>
  <p data-en="AI-generated document comparison report" data-pl="Raport porównania dokumentów wygenerowany przez AI">Raport porównania dokumentów wygenerowany przez AI</p>
  <iframe src="{{ report_url }}" title="Raport porównania dokumentów"></iframe>
  <a href="{{ report_url }}" target="_blank" rel="noopener noreferrer" class="open-link"
     data-en="Open report in a new tab ↗" data-pl="Otwórz raport w nowej karcie ↗">
    Otwórz raport w nowej karcie ↗
  </a>
</section>
{% endblock %}
