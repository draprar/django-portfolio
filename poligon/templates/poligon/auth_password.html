{% extends "poligon/base.html" %}

{% block title %}Hasło | Ćwiczba{% endblock %}

{% block poligon %}
<header class="poligon-header poligon-header-left">
  <h1 class="poligon-title" data-en="New password" data-pl="Nowe hasło">Nowe hasło</h1>
  <p class="poligon-subtitle"
     data-en="Enter the address used for the account. We will send a link."
     data-pl="Podaj adres użyty przy koncie. Wyślemy link.">
    Podaj adres użyty przy koncie. Wyślemy link.
  </p>
</header>

<section class="poligon-card poligon-form">
  <form method="post">
    {% csrf_token %}
    <label for="poligon-email">
      <span data-en="Email" data-pl="E-mail">E-mail</span>
    </label>
    <input id="poligon-email" type="email" name="email" required autocomplete="email">
    <button class="poligon-btn" type="submit" data-en="Send the link" data-pl="Wyślij link">Wyślij link</button>
  </form>
  <p class="poligon-links">
    <a href="{% url 'poligon:login' %}" data-en="Back to signing in" data-pl="Wróć do logowania">Wróć do logowania</a>
  </p>
</section>
{% endblock %}
